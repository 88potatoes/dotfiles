gui:
  theme:
    activeBorderColor:
      - "#ff9e64"
      - "bold"
    inactiveBorderColor:
      - "#27a1b9"
    searchingActiveBorderColor:
      - "#ff9e64"
      - "bold"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    markedBaseCommitFgColor:
      - "#7aa2f7"
    markedBaseCommitBgColor:
      - "#e0af68"
    unstagedChangesColor:
      - "#db4b4b"
    defaultFgColor:
      - "#c0caf5"
os:
  edit: 'nvim --server "$NVIM" --remote-tab {{filename}} && nvim --server "$NVIM" --remote-send ":lua for _, b in ipairs(vim.api.nvim_list_bufs()) do if vim.api.nvim_buf_get_name(b):find(\"lazygit\") then vim.api.nvim_buf_delete(b, {force=true}) end end<CR>"'
  editAtLine: 'nvim --server "$NVIM" --remote-tab {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>:lua for _, b in ipairs(vim.api.nvim_list_bufs()) do if vim.api.nvim_buf_get_name(b):find(\"lazygit\") then vim.api.nvim_buf_delete(b, {force=true}) end end<CR>"'
keybinding:
  worktrees:
    viewWorktreeOptions: <disabled>
  localBranches:
    viewGitFlowOptions: <disabled>
git:
  ignoreWhitespaceInDiffView: true
customCommands:
  - key: w
    context: worktrees
    description: Open worktree via wtz
    command: 'wtz s "{{.SelectedWorktree.Branch}}"'
    output: terminal
  - key: i
    context: localBranches
    description: Open branch/worktree via wtz
    command: 'wtz s "{{.SelectedLocalBranch.Name}}"'
    output: terminal
